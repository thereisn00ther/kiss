<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 16 Pro Web Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #05070c;
            background: radial-gradient(circle at 50% 25%, #181d29 0%, #030407 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Realistic iPhone 16 Pro Titanium chassis with outer ring highlights */
        .iphone-frame {
            box-shadow: 
                0 40px 120px -10px rgba(0, 0, 0, 0.98),
                0 0 0 3px #18181b,
                0 0 0 9px #27272a,
                0 0 0 12px #3f3f46,
                0 0 0 13px #18181b,
                inset 0 0 5px 2px rgba(255, 255, 255, 0.1);
        }
        /* Lock screen & Home screen custom wallpaper */
        .lockscreen-bg {
            background-color: #0b0f19;
            background-image: url('https://i.imgur.com/tdODgbY.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .home-wallpaper-bg {
            background-color: #0b0f19;
            background-image: url('https://i.imgur.com/tdODgbY.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        .insta-story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
    </style>
</head>
<body class="relative flex items-center justify-center p-2 sm:p-4 select-none">

    <!-- Toast Notification (iOS banner) -->
    <div id="toast-modal" class="fixed top-8 left-1/2 -translate-x-1/2 z-[99999] bg-neutral-900/95 border border-white/20 text-white px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-xl transform -translate-y-28 opacity-0 transition-all duration-300 flex items-center space-x-3 pointer-events-none">
        <i class="fa-solid fa-circle-info text-sky-400 text-lg"></i>
        <span id="toast-msg" class="text-sm font-medium">알림</span>
    </div>

    <!-- Phone Simulator Shell -->
    <div class="relative z-10 flex flex-col items-center">
        <!-- iPhone 16 Pro Frame -->
        <div id="iphone" class="iphone-frame relative w-[393px] h-[852px] max-h-[96vh] aspect-[393/852] bg-black rounded-[54px] overflow-visible flex flex-col justify-between">
            
            <!-- Physical Left Side Buttons -->
            <button onclick="triggerActionButton()" title="동작 버튼" class="absolute -left-[14px] top-[115px] w-[4px] h-[26px] bg-[#3a3a3c] hover:bg-[#48484a] rounded-l-sm border-l border-y border-neutral-600 focus:outline-none transition-all cursor-pointer z-50"></button>
            <button onclick="adjustVolume(1)" title="음량 올리기" class="absolute -left-[14px] top-[165px] w-[4px] h-[50px] bg-[#3a3a3c] hover:bg-[#48484a] rounded-l-sm border-l border-y border-neutral-600 focus:outline-none transition-all cursor-pointer z-50"></button>
            <button onclick="adjustVolume(-1)" title="음량 내리기" class="absolute -left-[14px] top-[228px] w-[4px] h-[50px] bg-[#3a3a3c] hover:bg-[#48484a] rounded-l-sm border-l border-y border-neutral-600 focus:outline-none transition-all cursor-pointer z-50"></button>

            <!-- Physical Right Side Power Button -->
            <button onclick="togglePowerButton()" title="전원/잠금 버튼" class="absolute -right-[14px] top-[180px] w-[4px] h-[75px] bg-[#3a3a3c] hover:bg-[#48484a] rounded-r-sm border-r border-y border-neutral-600 focus:outline-none transition-all cursor-pointer z-50"></button>

            <!-- iOS Volume HUD Overlay -->
            <div id="volume-hud" class="absolute left-2.5 top-[170px] z-[9990] w-1.5 h-20 bg-neutral-800/80 backdrop-blur-md rounded-full overflow-hidden opacity-0 transition-opacity duration-200 pointer-events-none flex flex-col justify-end">
                <div id="volume-level" class="w-full bg-white transition-all duration-100" style="height: 65%;"></div>
            </div>

            <!-- Screen Container with Rounded Corners -->
            <div id="screen" class="relative w-full h-full rounded-[50px] overflow-hidden flex flex-col justify-between text-white bg-black">
                
                <!-- Status Bar -->
                <div id="status-bar" class="absolute top-0 left-0 right-0 z-[9000] px-7 pt-3 flex justify-between items-center text-xs font-semibold tracking-tight text-white drop-shadow pointer-events-none transition-colors duration-200">
                    <span id="clock" class="text-[14.5px] font-bold tracking-normal">11:22</span>
                    
                    <!-- Dynamic Island: Static camera pill cutout -->
                    <div id="dynamic-island" class="pointer-events-none absolute left-1/2 -translate-x-1/2 top-2.5 bg-black h-[32px] w-[122px] rounded-full flex items-center justify-between px-3 shadow-md border border-neutral-900">
                        <div class="w-2.5 h-2.5 rounded-full bg-[#151518] border border-neutral-800 flex items-center justify-center flex-shrink-0">
                            <div class="w-1 h-1 rounded-full bg-blue-900/80"></div>
                        </div>
                        <div class="flex-1"></div>
                        <div class="w-3 h-3 rounded-full bg-[#0d0d10] flex-shrink-0"></div>
                    </div>

                    <!-- Right Status Bar Icons -->
                    <div class="flex items-center space-x-1.5 text-xs">
                        <i class="fa-solid fa-signal text-[11px]"></i>
                        <i class="fa-solid fa-wifi text-[11px]"></i>
                        <div class="bg-current/25 px-1.5 py-0.5 rounded-[5px] text-[9.5px] font-extrabold leading-none border border-current/40">100</div>
                    </div>
                </div>

                <!-- 1. Lock Screen -->
                <div id="lock-screen" class="absolute inset-0 z-[4000] flex flex-col justify-between p-6 pt-16 pb-10 cursor-pointer lockscreen-bg transition-opacity duration-300"
                     onclick="openPasscodeScreen()"
                     ontouchstart="handleTouchStart(event)"
                     ontouchend="handleTouchEnd(event)">
                    
                    <div class="flex flex-col items-center mt-12 text-white drop-shadow-md pointer-events-none">
                        <div class="flex items-center space-x-2 text-white/90 mb-1">
                            <i class="fa-solid fa-lock text-xs"></i>
                            <span id="lock-date" class="text-sm font-semibold tracking-wide">6월 22일 월요일</span>
                        </div>
                        <h1 id="lock-clock" class="text-[86px] font-light tracking-tighter leading-none mt-1">11:22</h1>
                    </div>

                    <div class="flex-1"></div>

                    <!-- Bottom Flashlight & Camera Shortcuts & Swipe Prompt -->
                    <div class="flex flex-col items-center pb-2 pointer-events-none">
                        <div class="w-full flex justify-between px-4 mb-4 pointer-events-auto">
                            <button onclick="event.stopPropagation(); showToast('🔦 손전등이 켜졌습니다.')" class="w-12 h-12 rounded-full bg-neutral-900/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-white text-lg active:scale-90 transition shadow-lg">
                                <i class="fa-solid fa-flashlight"></i>
                            </button>
                            <button onclick="event.stopPropagation(); openApp('photos')" class="w-12 h-12 rounded-full bg-neutral-900/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-white text-lg active:scale-90 transition shadow-lg">
                                <i class="fa-solid fa-camera"></i>
                            </button>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-neutral-800/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-white mb-2 shadow-lg animate-bounce">
                            <i class="fa-solid fa-chevron-up text-xs"></i>
                        </div>
                        <span class="text-xs font-semibold text-white/90 tracking-wide drop-shadow">화면을 클릭하여 암호 입력</span>
                    </div>
                </div>

                <!-- 2. Passcode Screen -->
                <div id="passcode-screen" class="absolute inset-0 z-[5000] hidden flex-col justify-between p-6 pt-20 pb-10 lockscreen-bg">
                    <div class="pt-6 flex flex-col items-center">
                        <h2 class="text-white text-lg font-bold mb-5 tracking-wide drop-shadow">암호 입력</h2>
                        <div id="passcode-dots" class="flex space-x-4 mb-4">
                            <div class="w-3.5 h-3.5 rounded-full border-2 border-white bg-transparent transition-all duration-150"></div>
                            <div class="w-3.5 h-3.5 rounded-full border-2 border-white bg-transparent transition-all duration-150"></div>
                            <div class="w-3.5 h-3.5 rounded-full border-2 border-white bg-transparent transition-all duration-150"></div>
                            <div class="w-3.5 h-3.5 rounded-full border-2 border-white bg-transparent transition-all duration-150"></div>
                            <div class="w-3.5 h-3.5 rounded-full border-2 border-white bg-transparent transition-all duration-150"></div>
                            <div class="w-3.5 h-3.5 rounded-full border-2 border-white bg-transparent transition-all duration-150"></div>
                        </div>
                    </div>

                    <!-- Keypad -->
                    <div class="max-w-[280px] mx-auto w-full grid grid-cols-3 gap-y-3.5 gap-x-5 px-2 my-auto">
                        <button type="button" onclick="pressPin('1')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white">1</span>
                        </button>
                        <button type="button" onclick="pressPin('2')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">2</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">ABC</span>
                        </button>
                        <button type="button" onclick="pressPin('3')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">3</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">DEF</span>
                        </button>

                        <button type="button" onclick="pressPin('4')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">4</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">GHI</span>
                        </button>
                        <button type="button" onclick="pressPin('5')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">5</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">JKL</span>
                        </button>
                        <button type="button" onclick="pressPin('6')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">6</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">MNO</span>
                        </button>

                        <button type="button" onclick="pressPin('7')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">7</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">PQRS</span>
                        </button>
                        <button type="button" onclick="pressPin('8')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">8</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">TUV</span>
                        </button>
                        <button type="button" onclick="pressPin('9')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white leading-none">9</span>
                            <span class="text-[9px] font-bold text-white/80 tracking-widest mt-0.5">WXYZ</span>
                        </button>

                        <div></div>
                        <button type="button" onclick="pressPin('0')" class="w-[72px] h-[72px] rounded-full bg-white/25 hover:bg-white/40 active:bg-white/60 backdrop-blur-md flex flex-col items-center justify-center cursor-pointer transition shadow-md mx-auto border border-white/20 outline-none">
                            <span class="text-3xl font-light text-white">0</span>
                        </button>
                        <button type="button" onclick="deletePin()" class="flex items-center justify-center cursor-pointer text-white hover:opacity-80 text-sm font-bold bg-transparent border-0 outline-none">
                            지우기
                        </button>
                    </div>

                    <div class="px-8 pb-2 flex justify-between items-center text-sm font-bold text-white">
                        <button type="button" class="cursor-pointer hover:opacity-80" onclick="showToast('🚨 긴급 상황 화면입니다.')">긴급 상황</button>
                        <button type="button" class="cursor-pointer hover:opacity-80" onclick="cancelPasscode()">취소</button>
                    </div>
                </div>

                <!-- 3. Home Screen (Custom Wallpaper, Notes app removed, KakaoTalk has NO '14' badge) -->
                <div id="home-screen" class="relative z-[1000] flex-1 hidden flex-col justify-between px-5 pt-16 pb-0 overflow-y-auto no-scrollbar home-wallpaper-bg">
                    <div>
                        <!-- Widgets -->
                        <div class="grid grid-cols-1 gap-3 mb-6 mt-2">
                            <div onclick="openApp('everytime')" class="bg-black/40 hover:bg-black/50 backdrop-blur-xl border border-white/20 p-4 rounded-3xl shadow-xl flex flex-col justify-between cursor-pointer transition transform active:scale-98">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="text-[11px] font-semibold text-white/80">오늘의 시간표</p>
                                        <p class="text-[13px] font-extrabold text-white mt-0.5">연기실습 5 / 움직임 V</p>
                                    </div>
                                    <div class="w-8 h-8 rounded-xl bg-white flex items-center justify-center shadow-sm overflow-hidden p-0.5">
                                        <svg viewBox="0 0 100 100" class="w-full h-full">
                                            <path d="M 20 50 A 30 30 0 0 0 80 50" fill="none" stroke="#262626" stroke-width="14"/>
                                            <circle cx="75" cy="32" r="10.5" fill="#262626"/>
                                            <path d="M 42 44 L 46 57 A 4 4 0 0 0 54 57 L 58 44 Z" fill="#e0140a"/>
                                            <circle cx="50" cy="43" r="8" fill="#ff1e14"/>
                                        </svg>
                                    </div>
                                </div>
                                <p class="text-[11px] text-white/90 font-medium mt-3 flex items-center space-x-1.5">
                                    <i class="fa-solid fa-location-dot text-[10px] text-red-400"></i>
                                    <span>연극원 영상원(본관) L201</span>
                                </p>
                            </div>
                        </div>

                        <!-- App Grid: Everytime, Photos, KakaoTalk, Instagram (Notes app deleted) -->
                        <div class="grid grid-cols-4 gap-y-5 gap-x-3">
                            <!-- 1) Everytime -->
                            <div onclick="openApp('everytime')" class="flex flex-col items-center cursor-pointer group">
                                <div class="w-[60px] h-[60px] bg-white rounded-[15px] flex items-center justify-center shadow-lg transform transition group-hover:scale-105 active:scale-95 overflow-hidden p-1 border border-neutral-300">
                                    <svg viewBox="0 0 100 100" class="w-full h-full">
                                        <path d="M 20 50 A 30 30 0 0 0 80 50" fill="none" stroke="#262626" stroke-width="14"/>
                                        <circle cx="75" cy="32" r="10.5" fill="#262626"/>
                                        <path d="M 42 44 L 46 57 A 4 4 0 0 0 54 57 L 58 44 Z" fill="#e0140a"/>
                                        <circle cx="50" cy="43" r="8" fill="#ff1e14"/>
                                    </svg>
                                </div>
                                <span class="text-[11px] font-semibold mt-1.5 drop-shadow text-white">에브리타임</span>
                            </div>

                            <!-- 2) Photos (Gallery) -->
                            <div onclick="openApp('photos')" class="flex flex-col items-center cursor-pointer group">
                                <div class="w-[60px] h-[60px] bg-white rounded-[15px] flex items-center justify-center shadow-lg transform transition group-hover:scale-105 active:scale-95 overflow-hidden border border-neutral-800">
                                    <svg viewBox="0 0 100 100" class="w-full h-full">
                                        <rect width="100" height="100" fill="#ffffff"/>
                                        <g style="mix-blend-mode: multiply;">
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#ffac2f"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#b7d332" transform="rotate(45 50 50)"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#6cc24a" transform="rotate(90 50 50)"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#00a4bd" transform="rotate(135 50 50)"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#63b5e5" transform="rotate(180 50 50)"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#a864c9" transform="rotate(225 50 50)"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#f382ab" transform="rotate(270 50 50)"/>
                                            <rect x="37.5" y="9" width="25" height="39" rx="12.5" fill="#fb5047" transform="rotate(315 50 50)"/>
                                        </g>
                                    </svg>
                                </div>
                                <span class="text-[11px] font-semibold mt-1.5 drop-shadow text-white">갤러리</span>
                            </div>

                            <!-- 3) KakaoTalk (Notification badge removed) -->
                            <div onclick="openApp('kakaotalk')" class="flex flex-col items-center cursor-pointer group relative">
                                <div class="w-[60px] h-[60px] bg-[#fee500] rounded-[15px] flex items-center justify-center text-[#3c1e1e] shadow-lg transform transition group-hover:scale-105 active:scale-95 border border-neutral-800">
                                    <i class="fa-solid fa-comment text-2xl"></i>
                                </div>
                                <span class="text-[11px] font-semibold mt-1.5 drop-shadow text-white">카카오톡</span>
                            </div>

                            <!-- 4) Instagram -->
                            <div onclick="openApp('instagram')" class="flex flex-col items-center cursor-pointer group">
                                <div class="w-[60px] h-[60px] bg-gradient-to-tr from-[#feda75] via-[#d62976] to-[#962fbf] rounded-[15px] flex items-center justify-center text-white shadow-lg transform transition group-hover:scale-105 active:scale-95 border border-pink-400">
                                    <i class="fa-brands fa-instagram text-3xl"></i>
                                </div>
                                <span class="text-[11px] font-semibold mt-1.5 drop-shadow text-white">인스타그램</span>
                            </div>
                        </div>
                    </div>

                    <!-- Dock (Messages is non-clickable, KakaoTalk has NO '14' badge) -->
                    <div id="home-dock" class="px-3 py-2.5 bg-white/20 backdrop-blur-2xl mb-2 rounded-[30px] border border-white/20 flex justify-around items-center shadow-xl">
                        <!-- Phone App -->
                        <div onclick="openApp('phone')" class="w-[52px] h-[52px] bg-gradient-to-b from-[#34c759] to-[#30b050] rounded-2xl flex items-center justify-center text-white shadow cursor-pointer hover:scale-105 active:scale-95 transition">
                            <i class="fa-solid fa-phone text-xl"></i>
                        </div>
                        
                        <!-- Messages App: Completely disabled / non-clickable as requested -->
                        <div class="w-[52px] h-[52px] bg-gradient-to-b from-[#34c759] to-[#28cd41] rounded-2xl flex items-center justify-center text-white shadow p-1.5 opacity-90 pointer-events-none cursor-default">
                            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow">
                                <path d="M 50 12 C 27.9 12 10 27.8 10 47.5 C 10 58.1 15.1 67.7 23 74.2 L 18 90 L 35.2 81.3 C 39.8 82.6 44.8 83.3 50 83.3 C 72.1 83.3 90 67.5 90 47.5 C 90 27.8 72.1 12 50 12 Z" fill="#ffffff"/>
                            </svg>
                        </div>

                        <!-- KakaoTalk in Dock (Notification badge removed) -->
                        <div onclick="openApp('kakaotalk')" class="relative w-[52px] h-[52px] bg-[#fee500] rounded-2xl flex items-center justify-center text-[#3c1e1e] shadow cursor-pointer hover:scale-105 active:scale-95 transition">
                            <i class="fa-solid fa-comment text-xl"></i>
                        </div>

                        <!-- Safari App -->
                        <div onclick="openApp('safari')" class="w-[52px] h-[52px] rounded-2xl flex items-center justify-center shadow cursor-pointer hover:scale-105 active:scale-95 transition overflow-hidden bg-white">
                            <img src="https://i.imgur.com/TgqPQti.png" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/1890ff/ffffff?text=Safari'">
                        </div>
                    </div>
                </div>

                <!-- Application Screen Overlay Window -->
                <div id="app-window" class="absolute inset-0 z-[6000] hidden flex-col bg-white overflow-hidden transition-all duration-200"></div>

                <!-- Home Indicator Bar -->
                <div id="home-indicator" class="relative z-[9500] pb-2 pt-1 flex justify-center items-center cursor-pointer bg-transparent transition-colors duration-200" onclick="handleHomeBarClick()">
                    <div id="home-bar-pill" class="w-32 h-1.5 bg-white/90 rounded-full hover:opacity-100 transition shadow"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript Logic (Silent mode: no sound effects) -->
    <script>
        let phoneState = 'lock'; // 'lock', 'passcode', 'home', 'app'
        let enteredPin = "";
        const CORRECT_PIN = "900210";
        let everytimeDetailOpen = false;

        // Live Clock Synced
        function updateClock() {
            const timeStr = "11:22";
            const clockEl = document.getElementById('clock');
            const lockClockEl = document.getElementById('lock-clock');
            if (clockEl) clockEl.innerText = timeStr;

            if (level) level.style.height = `${currentVolume}%`;

        function handleTouchEnd(e) {
            if (e.changedTouches && e.changedTouches.length > 0) {

        function cancelPasscode() {
            phoneState = 'lock';

            document.getElementById('lock-screen').style.display = 'flex';
            setStatusBarTheme('light');

        function pressPin(digit) {
            if (phoneState !== 'passcode') return;
            if (enteredPin.length < 6) {
                enteredPin += String(digit);
                updatePinDots();
                if (enteredPin.length === 6) setTimeout(verifyPin, 120);
            }
        }

        function deletePin() {
            if (phoneState !== 'passcode') return;
            if (enteredPin.length > 0) {

        function updatePinDots() {
            const dots = document.getElementById('passcode-dots').children;
            for (let i = 0; i < 6; i++) {
                dots[i].style.backgroundColor = (i < enteredPin.length) ? '#ffffff' : 'transparent';
            }
        }

        function verifyPin() {
            if (enteredPin === CORRECT_PIN) {
                phoneState = 'home';
                document.getElementById('passcode-screen').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('home-screen').style.display = 'flex';
                setStatusBarTheme('light');
            } else {
                const dotsContainer = document.getElementById('passcode-dots');
                dotsContainer.classList.add('animate-shake');
                setTimeout(() => {
                    dotsContainer.classList.remove('animate-shake');
                    enteredPin = "";
                    updatePinDots();
                }, 400);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (phoneState === 'lock' && (e.key === 'Enter' || e.key === ' ')) openPasscodeScreen();

                else if (e.key === 'Backspace') deletePin();

        let callDialogIndex = 0;

        function startPhoneCall(targetName) {
            callTargetName = targetName;
            callActiveState = true;
            callDurationSec = 0;
            callStatusText = '연결 중...';
            callDialogIndex = 0;
            callDialogText = '';

            setStatusBarTheme('light');
            const appWindow = document.getElementById('app-window');
            appWindow.innerHTML = renderActiveCallScreen();

            setTimeout(() => {
                if (!callActiveState) return;
                callStatusText = '00:00';
                appWindow.innerHTML = renderActiveCallScreen();
                
                window.callTimerInterval = setInterval(() => {
                    callDurationSec++;
                    let m = String(Math.floor(callDurationSec / 60)).padStart(2, '0');
                    let s = String(callDurationSec % 60).padStart(2, '0');
                    callStatusText = `${m}:${s}`;
                    const timerEl = document.getElementById('call-timer-display');
                    if (timerEl) timerEl.innerText = callStatusText;
                }, 1000);

                if (callTargetName === '권유리 교수님') {
                    const dialogSteps = [
                        { text: "여보세요", hold: 3000 },
                        { text: "수영아?", hold: 3000 },
                        { text: "너 많이 마셨구나.", hold: 4500 },
                        { text: "몸도 약한 애가...", hold: 4500 },
                        { text: "애들이랑 너무 많이 마시진 마.", hold: 4500 },
                        { text: "왜 전화했어?", hold: 3000 },
                        { text: "......", hold: 4000 },
                        { text: "...데리러 갈게.", hold: 3000 },
                        { text: "거기 가만히 있어.", hold: 3000, endCall: true }
                    ];

                    callDialogIndex = 0;
                    function runNextDialogStep() {
                        if (callDialogIndex < dialogSteps.length && callActiveState) {
                            const step = dialogSteps[callDialogIndex];
                            callDialogText = step.text;
                            const subEl = document.getElementById('call-dialog-sub');
                            if (subEl) subEl.innerText = callDialogText;
                            
                            if (step.endCall) {
                                setTimeout(() => {
                                    if (!callActiveState) return;
                                    const endStatusEl = document.getElementById('call-end-status');
                                    if (endStatusEl) {
                                        endStatusEl.innerText = '통화종료';
                                        endStatusEl.style.color = '#ffffff';
                                    }
                                    if (window.callTimerInterval) clearInterval(window.callTimerInterval);
                                    setTimeout(() => {
                                        if (callActiveState) endPhoneCall();
                                    }, 2000);
                                }, 1500);
                                return;
                            }

                            callDialogIndex++;
                            if (step.hold > 0) {
                                window.callDialogTimeout = setTimeout(runNextDialogStep, step.hold);
                            }
                        }
                    }
                    window.callDialogTimeout = setTimeout(runNextDialogStep, 1000);
                }
            }, 1500);
